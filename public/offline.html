<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171916" media="(prefers-color-scheme: dark)">
<title>ded - notes · Offline</title>
<style>
  :root{color-scheme:light dark;--bg:#f7f7f5;--text:#252722;--muted:#6e7368}
  @media (prefers-color-scheme:dark){:root{--bg:#171916;--text:#eceee8;--muted:#a3aa98}}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;display:grid;place-items:center}
  main{text-align:center;padding:24px}
  .mark{margin:0 auto 20px;width:48px;height:48px;border-radius:14px;background:#687b62;color:#fff;display:grid;place-items:center;font:italic 34px Georgia,serif}
  h1{font:600 28px Georgia,serif;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 20px}
  button{font:inherit;font-weight:600;border:0;border-radius:9px;background:#687b62;color:#fff;padding:10px 18px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="mark">d</div>
  <h1>A quiet moment.</h1>
  <p>You’re offline. Reconnect to open ded - notes.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
